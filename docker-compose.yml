services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16
    container_name: lastsignal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lastsignal}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-lastsignal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lastsignal_net

  # ─────────────────────────────────────────
  # Keycloak
  # ─────────────────────────────────────────
  keycloak:
      image: quay.io/keycloak/keycloak:24.0
      container_name: lastsignal_keycloak
      restart: unless-stopped
      environment:
        KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
        KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-lastsignal}
        KC_DB_USERNAME: ${POSTGRES_USER:-admin}
        KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
        KC_HOSTNAME: localhost
        KC_HTTP_ENABLED: "true"
      command: start-dev --import-realm
      ports:
        - "8080:8080"
      volumes:
        - ./keycloak:/opt/keycloak/data/import
      depends_on:
        db:
          condition: service_healthy
      networks:
        - lastsignal_net

  # ─────────────────────────────────────────
  # FastAPI
  # ─────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lastsignal_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-lastsignal}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lastsignal}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-lastsignal-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-changeme}
      AI_API_KEY: ${AI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - lastsignal_net
      
  ngrok:
    image: ngrok/ngrok:latest
    container_name: lastsignal_ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http keycloak:8080
    ports:
      - "4040:4040"
    depends_on:
      - keycloak
    networks:
      - lastsignal_net

# ─────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────
volumes:
  postgres_data:

networks:
  lastsignal_net:
    driver: bridge